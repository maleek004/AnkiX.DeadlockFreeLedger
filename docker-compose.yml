services:
  postgres:
    image: postgres:16-alpine
    container_name: ankix-ledger-kata-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kata_password
      POSTGRES_DB: ledger_kata
    ports:
      - "54339:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger_kata"]
      interval: 2s
      timeout: 2s
      retries: 10
